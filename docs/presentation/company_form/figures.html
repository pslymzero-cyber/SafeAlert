<title>사내 폼 보고본 삽화</title>
<style>
  :root {
    --ink: #1C2833; --ink-2: #5D6D7E; --ink-3: #95A5A6;
    --danger: #C0392B; --warn: #D68910; --safe: #1E8449; --struct: #34495E; --line: #D5DBDB;
    --sans: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "Consolas", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: var(--sans); }
  figure { margin: 0; padding: 14px; background: #fff; display: inline-block; }
  .cap { font-size: 13px; color: var(--ink-2); text-align: center; margin-top: 10px; }
  text { font-family: var(--sans); }
  .num { font-family: var(--mono); font-weight: 700; }
</style>

<!-- ① 판정 반경 — 실제 비례 축척 (9 px = 1 m) -->

      <rect x="-158" y="-16" width="14" height="3" fill="#D68910"/>
      <text x="-138" y="-9" font-size="13" fill="#5D6D7E">경고</text>
      <rect x="-96" y="-16" width="14" height="3" fill="#C0392B"/>
      <text x="-76" y="-9" font-size="13" fill="#5D6D7E">위험</text>

    </g>
  </svg>
</figure>

<!-- ② 단말 수 대비 상호 감지쌍 -->
<figure id="pairs">
  <svg width="700" height="250" viewBox="0 0 700 250">
    <g id="grp"></g>
  </svg>
  <script>
    (function () {
      const g = document.getElementById("grp");
      const SETS = [[3, 3, "3대"], [5, 10, "5대"], [10, 45, "10대"]];
      SETS.forEach(([n, pairs, label], k) => {
        const cx = 130 + k * 230, cy = 100, R = 62;
        const pts = Array.from({ length: n }, (_, i) => {
          const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
          return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
        });
        let s = "";
        for (let i = 0; i < n; i++)
          for (let j = i + 1; j < n; j++)
            s += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="#7DA0C4" stroke-width="1" opacity=".7"/>`;
        pts.forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="6" fill="#34495E"/>`; });
        s += `<text x="${cx}" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#1C2833">${label}</text>`;
        s += `<text x="${cx}" y="228" font-size="19" text-anchor="middle" fill="#C0392B" class="num">${pairs} 쌍</text>`;
        g.insertAdjacentHTML("beforeend", s);
      });
    })();
  </script>
</figure>
