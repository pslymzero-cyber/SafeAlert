name: Alert digest

# Periodically aggregates alert history and commits it to the repo.
#   database.rules.json: the root is ".read":false, and {firebaseRoot}/alerts and uwb_probe
#   have no .read rule at all, so REST cannot read them. echo_calib is "auth != null", but
#   CI has no user token. FIREBASE_DB_SECRET is an admin credential that bypasses the rules,
#   so only here are all three read — the same credential as release.yml's version PATCH.
#
#   The output is a single ALERTS.md at the repo root. Opening the repo in the GitHub app
#   shows it near the top of the file list — no need to dig through folders.
#   Raw JSON is never committed — this repo is public.
#   hb (lone-worker alive sessions) has no .read rule either, so it is read only with the same admin secret,
#   and only per-center counts, without identifiers, go into the '연락 끊김 (기록만)' table.

on:
  schedule:
    - cron: '0 21 * * 0'   # every Monday 06:00 KST (Sunday 21:00 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: '집계할 최근 일수'
        required: false
        default: '28'
      from:
        description: '시작일 고정 (YYYYMMDD). 넣으면 days 를 무시한다 - 발표 자료용'
        required: false
        default: ''

concurrency:
  group: alert-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04   # ubuntu-latest moves to newer Ubuntu releases; pinned for reproducible runs
    permissions:
      contents: write   # to commit ALERTS.md

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Without credentials, stop here but do not fail.
      #   Write "what was missing" into ALERTS.md and commit it —
      #   opening just that file on a phone shows what to do next.
      - name: 자격 확인
        id: creds
        env:
          DB: ${{ secrets.FIREBASE_DB_URL }}
          KEY: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          MISS=""
          [ -n "$DB" ]  || MISS="$MISS FIREBASE_DB_URL"
          [ -n "$KEY" ] || MISS="$MISS FIREBASE_DB_SECRET"
          if [ -n "$MISS" ]; then
            echo "::warning::저장소 시크릿 미설정 —$MISS"
            echo "missing=$MISS" >> "$GITHUB_OUTPUT"
          fi

      # List the firebaseRoot nodes (one per workplace). shallow fetches only the keys, not the values.
      #   /version is the shared update channel, not a root, so it is skipped.
      - name: 사업장 목록
        id: sites
        if: steps.creds.outputs.missing == ''
        env:
          DB: ${{ secrets.FIREBASE_DB_URL }}
          KEY: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          if ! curl -fsS "${DB%/}/.json?shallow=true&auth=$KEY" -o root.json; then
            echo "::warning::루트 읽기 실패 — URL 또는 시크릿을 확인할 것"
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SITES=$(python3 -c "
          import json
          d = json.load(open('root.json')) or {}
          print(' '.join(k for k in sorted(d) if k != 'version'))")
          echo "사업장: ${SITES:-(없음)}"
          echo "list=$SITES" >> "$GITHUB_OUTPUT"

      - name: 경보 이력 집계
        env:
          DB: ${{ secrets.FIREBASE_DB_URL }}
          KEY: ${{ secrets.FIREBASE_DB_SECRET }}
          DAYS: ${{ github.event.inputs.days || '28' }}
          SINCE: ${{ github.event.inputs.from || '' }}
          MISSING: ${{ steps.creds.outputs.missing }}
          SITES: ${{ steps.sites.outputs.list }}
        run: |
          set -euo pipefail
          # SINCE pins the start date (DAYS is ignored), so reruns do not slide the window; the end is still the latest data.
          FROM=${SINCE:-$(date -u -d "-${DAYS} days" +%Y%m%d)}
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          {
            echo "# 경보 이력 집계"
            echo
            if [ -n "$SINCE" ]; then
              echo "> 자동 생성 — $NOW · 기간 고정 (${FROM} 이후)"
            else
              echo "> 자동 생성 — $NOW · 최근 ${DAYS}일 (${FROM} 이후)"
            fi
            echo ">"
            echo "> \`.github/workflows/alert-digest.yml\` 이 매주 갱신한다."
            echo "> 원본 기록은 공개 저장소에 올리지 않는다 — 집계값만 남긴다."
            echo
          } > ALERTS.md

          if [ -n "$MISSING" ]; then
            {
              echo "## 아직 집계하지 못했다"
              echo
              echo "저장소 시크릿이 없다 —\`$MISSING\`"
              echo
              echo "**Settings → Secrets and variables → Actions → New repository secret** 에서 두 개를 넣는다."
              echo
              echo "| 이름 | 값 |"
              echo "|------|----|"
              echo "| \`FIREBASE_DB_URL\` | Realtime Database URL (예: \`https://<프로젝트>.firebaseio.com\`) |"
              echo "| \`FIREBASE_DB_SECRET\` | 프로젝트 설정 → 서비스 계정 → 데이터베이스 비밀 |"
              echo
              echo "> 규칙(\`database.rules.json\`)이 읽기를 막고 있어 일반 경로로는 안 받아진다."
              echo "> 위 비밀만 규칙을 우회한다. 값은 로그에 찍히지 않는다."
              echo
            } >> ALERTS.md
            exit 0
          fi

          if [ -z "${SITES// /}" ]; then
            printf '## firebaseRoot 노드가 없다\n\n> 데이터베이스 루트에서 version 을 뺀 노드(= 폰 개발자 설정의 firebaseRoot 값)가 하나도 보이지 않는다.\n> 앞 단계(사업장 목록)의 루트 읽기 실패 경고도 확인할 것.\n\n' >> ALERTS.md
            exit 0
          fi

          for SITE in $SITES; do
            # Fetch only the recent range with orderBy="$key" + startAt (not the whole node).
            # Limit: an all-digit center code sorts as an integer key and, if smaller than FROM, is cut off by the server-side startAt;
            # a non-numeric code sorts after the integer keys, so its whole history comes down and --from trims it.
            if curl -fsS --get "${DB%/}/$SITE/alerts.json" \
                 --data-urlencode "auth=$KEY" \
                 --data-urlencode 'orderBy="$key"' \
                 --data-urlencode "startAt=\"$FROM\"" \
                 -o "alerts-$SITE.json"; then

              # echo_calib = each device's last sign-of-life stamp (overwritten hourly). It is the active-rate denominator.
              #   One small node per device, so it is fetched whole. If it is missing, only that section is dropped.
              ECHO=""
              if curl -fsS --get "${DB%/}/$SITE/echo_calib.json" \
                   --data-urlencode "auth=$KEY" -o "echo-$SITE.json"; then
                ECHO="--echo echo-$SITE.json"
              else
                echo "::notice::$SITE echo_calib 없음 — 단말 가동 섹션 생략"
              fi

              # uwb_probe = raw UWB distance × RSSI samples, collected only in sessions with the developer settings switch on.
              #   It is keyed by date like alerts, so the period is cut the same way.
              PROBE=""
              if curl -fsS --get "${DB%/}/$SITE/uwb_probe.json" \
                   --data-urlencode "auth=$KEY" \
                   --data-urlencode 'orderBy="$key"' \
                   --data-urlencode "startAt=\"$FROM\"" \
                   -o "probe-$SITE.json"; then
                PROBE="--probe probe-$SITE.json"
              else
                echo "::notice::$SITE uwb_probe 없음 — 거리 환산 섹션 생략"
              fi

              python3 .github/scripts/analyze_alerts.py "alerts-$SITE.json" \
                --label "${SITE^^}" --md ALERTS.md --append --no-ids \
                --from "$FROM" $ECHO $PROBE

              # hb = lone-worker alive sessions. Fetched whole; the period is cut by session start time.
              if curl -fsS --get "${DB%/}/$SITE/hb.json" \
                   --data-urlencode "auth=$KEY" -o "hb-$SITE.json"; then
                python3 .github/scripts/hb_digest.py "hb-$SITE.json" --md ALERTS.md --from "$FROM"
              else
                echo "::notice::$SITE hb 없음 — 연락 끊김 섹션 생략"
              fi
            else
              echo "::warning::$SITE 읽기 실패 — 건너뜀"
              printf '## %s\n\n> 읽기 실패.\n\n' "${SITE^^}" >> ALERTS.md
            fi
            rm -f "alerts-$SITE.json" "echo-$SITE.json" "probe-$SITE.json" "hb-$SITE.json"
          done

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ALERTS.md
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore(alerts): 경보 이력 집계 갱신"
          git push
