name: Build & Release

# Runs automatically when a tag like v1.0.52 is pushed
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04   # ubuntu-latest moves to newer Ubuntu releases; pinned for reproducible releases
    permissions:
      contents: write   # to create the GitHub Release and upload the APK

    steps:
      - name: Checkout
        uses: actions/checkout@v7   # node24 runtime (v4 uses node20)

      # Strip the v from the tag name to get the version (e.g. v1.0.52 → 1.0.52)
      # is_release: true only for a release tag of exactly the form vX.Y.Z (an allowlist, not a denylist).
      #   Anything extra (citest, rc, typos) gives false → the Firebase production channel is left untouched.
      - name: Extract version
        id: ver
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          if printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Devices compare Firebase latest (the tag) with their own versionName: a tag ahead of it offers the
            # same update on every start, one behind hides the update. Checked before the tests so the run stops
            # right away.
            VN=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle)
            if [ "v$VN" != "$GITHUB_REF_NAME" ]; then
              echo "::error::태그 $GITHUB_REF_NAME 와 app/build.gradle versionName '$VN' 이 다르다 — versionName 을 맞추고 다시 태그한다"
              exit 1
            fi
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "::notice::'$GITHUB_REF_NAME' 은 정식 릴리스 태그(vX.Y.Z)가 아니다 — Firebase 업데이트를 건너뛴다"
          fi

      # Do not build if the settings PIN secret is empty or not exactly 3 digits (the value is never printed).
      #   Local builds keep the '000' default (app/build.gradle). Checked before the tests so the run stops right away.
      - name: Check dev PIN secret
        env:
          SA_DEV_PIN: ${{ secrets.SA_DEV_PIN }}
        run: |
          if [[ ! "$SA_DEV_PIN" =~ ^[0-9]{3}$ ]]; then
            echo "::error::SA_DEV_PIN 비밀값이 비었거나 숫자 3자리가 아니다"
            exit 1
          fi

      # SOS mail script URL. If it is missing, build with only the mail feature off (no failure; the value is never printed).
      - name: Check SOS mail URL secret
        env:
          SA_SOS_MAIL_URL: ${{ secrets.SA_SOS_MAIL_URL }}
        run: |
          if [ -z "$SA_SOS_MAIL_URL" ]; then
            echo "::warning::SA_SOS_MAIL_URL 비밀값이 없어 구조 요청 메일이 꺼진 채로 빌드된다"
          elif [[ ! "$SA_SOS_MAIL_URL" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]]; then
            echo "::warning::SA_SOS_MAIL_URL 형식이 웹 앱 배포 주소(https://script.google.com/macros/s/…/exec)가 아니다"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5   # node24 runtime
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # Release signing. Secrets are passed only through env (never as command-line arguments or in logs).
      #   The signing fingerprint is verified after the build at the apksigner gate.
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Script checks (mail script, digests)
        run: |
          node scripts/sos-mail/check.js
          python3 .github/scripts/test_hb_digest.py
          python3 .github/scripts/test_analyze_alerts.py

      - name: Run unit tests (golden RSSI cascade)
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

      # Gradle 8.6 has no failOnNoDiscoveredTests (8.13+), so 'zero tests discovered' still
      #   ends in BUILD SUCCESSFUL. If the source-set path ever drifts, this gate silently decays into a green
      #   no-op, so check the result XML directly to confirm the golden tests actually ran.
      - name: Assert golden tests actually ran
        run: |
          set -euo pipefail
          XML_DIR=app/build/test-results/testDebugUnitTest
          # The "com.wf11.safealert.ble." package prefix before the class names is hard-coded in the path built below —
          # if the golden tests move out of this package, update this script too.
          REQUIRED="RssiCascadeTest RssiCascadeIsolationTest MedianFilterWarmupTest AlertCascadeGoldenTest UwbSessionGoldenTest LowSpeedApproachRegressionTest BeaconFullIdTest SpecialAlertTimeGateTest"
          MIN_TOTAL=477   # floor for the total unit test count = number of @Test methods; fewer runs mean tests silently disappeared

          if [ ! -d "$XML_DIR" ]; then
            echo "::error::테스트 결과 디렉터리가 없다: $XML_DIR — 테스트가 한 건도 실행되지 않았다"
            exit 1
          fi

          for cls in $REQUIRED; do
            f="$XML_DIR/TEST-com.wf11.safealert.ble.$cls.xml"
            if [ ! -f "$f" ]; then
              echo "::error::골든 테스트 클래스 결과 누락: $cls — 소스셋 경로 이탈 또는 클래스 삭제 의심"
              exit 1
            fi
          done

          TOTAL=$(awk -F'tests="' '/<testsuite/ {split($2, a, "\""); s += a[1]} END {print s+0}' "$XML_DIR"/*.xml)
          echo "discovered tests = $TOTAL (floor $MIN_TOTAL)"
          if [ "$TOTAL" -lt "$MIN_TOTAL" ]; then
            echo "::error::실행된 테스트가 $TOTAL 건으로 하한 $MIN_TOTAL 미만이다 — 테스트가 조용히 사라졌다"
            exit 1
          fi

      - name: Build release APK
        env:
          SA_RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          SA_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SA_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SA_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SA_DEV_PIN: ${{ secrets.SA_DEV_PIN }}
          SA_SOS_MAIL_URL: ${{ secrets.SA_SOS_MAIL_URL }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      # Without signing, the output is app-release-unsigned.apk and mv fails (a natural gate)
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk safealert-${{ steps.ver.outputs.name }}.apk

      # Fail at once if the fingerprint differs from the release key's (a public value) — blocks shipping a wrongly signed APK
      - name: Verify release signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          OUT=$("$APKSIGNER" verify --print-certs safealert-${{ steps.ver.outputs.name }}.apk)
          echo "$OUT"
          echo "$OUT" | grep -qi "SHA-256 digest: 5e7936faf6fda40be4a59060384d3914e5b7e1af6d25a1e356781bc0e50c0df4" \
            || { echo "::error::APK 서명 지문이 릴리스 키와 다름 — RELEASE_KEYSTORE secret 확인 필요"; exit 1; }

      - name: APK SHA-256
        id: apk
        run: echo "sha256=$(sha256sum safealert-${{ steps.ver.outputs.name }}.apk | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # Overwrite the DB security rules with the repo's database.rules.json. No manual console work.
      #   Runs before the APK is published and the version is updated, so the new rules go live while devices still run
      #   older app versions: any rules change must keep accepting the reads and writes of every app version still in the field.
      #   If the replacement fails the job stops here, so a new app never meets the old rules.
      #   The legacy secret is an admin credential that bypasses the rules, so the version PATCH below still passes after the rules change.
      - name: Deploy DB security rules
        if: ${{ steps.ver.outputs.is_release == 'true' }}
        run: |
          curl -fsSX PUT --data-binary @database.rules.json \
            "${{ secrets.FIREBASE_DB_URL }}/.settings/rules.json?auth=${{ secrets.FIREBASE_DB_SECRET }}"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v3   # node24 runtime
        with:
          name: SafeAlert v${{ steps.ver.outputs.name }}
          files: safealert-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true   # notes list merged pull requests plus a compare link; direct commits to master are not listed

      - name: Update Firebase Realtime DB
        if: ${{ steps.ver.outputs.is_release == 'true' }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/safealert-${VER}.apk"
          # APK hash the app checks before installing. A value typed into the console goes stale at the next tag, so it must come from CI.
          SHA="${{ steps.apk.outputs.sha256 }}"
          # Shared /version — the path apps 1.1.71 and later read. Every device reads it regardless of site code.
          curl -fsSX PATCH \
            "${{ secrets.FIREBASE_DB_URL }}/version.json?auth=${{ secrets.FIREBASE_DB_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"latest\":\"${VER}\",\"apk_url\":\"${APK_URL}\",\"apk_sha256\":\"${SHA}\",\"force_update\":false,\"changelog\":\"\"}"
          # Old path /wf11/version — for field devices on 1.1.70 or older. Remove once every device is confirmed updated.
          curl -fsSX PATCH \
            "${{ secrets.FIREBASE_DB_URL }}/wf11/version.json?auth=${{ secrets.FIREBASE_DB_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"latest\":\"${VER}\",\"apk_url\":\"${APK_URL}\",\"apk_sha256\":\"${SHA}\",\"force_update\":false,\"changelog\":\"\"}"
