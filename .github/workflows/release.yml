name: Build & Release

# v1.0.52 형식의 태그를 push하면 자동 실행
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 생성·업로드 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v7   # node24 런타임. v4(node20)는 러너 강제 우회로만 돌던 상태였다

      - name: Set up JDK 17
        uses: actions/setup-java@v5   # node24 런타임
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Restore debug keystore (로컬과 동일 서명 → 덮어쓰기 설치 가능)
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > $HOME/.android/debug.keystore

      # 복원된 keystore 가 로컬 키와 다르면 즉시 실패 — 잘못된 서명 APK 배포 차단
      - name: Verify keystore fingerprint
        run: |
          OUT=$(keytool -list -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey)
          echo "$OUT"
          echo "$OUT" | grep -q "4C:40:F0:35:E4:2C:78:D0:71:34:5F:EB:B6:23:4E:F7:56:F9:11:6B:7C:92:05:00:0A:14:5B:D0:F7:DF:19:21" \
            || { echo "::error::복원된 keystore 가 로컬 키와 다름 — DEBUG_KEYSTORE secret 확인 필요"; exit 1; }

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests (golden RSSI cascade)
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

      # CI-01 보강: Gradle 8.6 에는 failOnNoDiscoveredTests(8.13+) 가 없어 '테스트 0건 발견'도
      #   BUILD SUCCESSFUL 로 끝난다. 소스셋 경로가 한 번 어긋나면 이 게이트가 조용히 그린
      #   no-op 으로 퇴화하므로, 골든 테스트가 실제로 실행됐는지 결과 XML 로 직접 확인한다.
      - name: Assert golden tests actually ran
        run: |
          set -euo pipefail
          XML_DIR=app/build/test-results/testDebugUnitTest
          # 클래스명 앞의 "com.wf11.safealert.ble." 패키지 접두어는 아래 경로 조합에 하드코딩돼
          # 있다 — 이 패키지 밖으로 골든 테스트가 옮겨지면 이 스크립트도 함께 고쳐야 한다.
          REQUIRED="RssiCascadeTest RssiCascadeIsolationTest MedianFilterWarmupTest AlertCascadeGoldenTest UwbSessionGoldenTest LowSpeedApproachRegressionTest"
          MIN_TOTAL=42   # 8 + 3 + 6 + 8(AlertCascadeGoldenTest,02-02) + 16(UwbSessionGoldenTest,02-03) + 1(LowSpeedApproachRegressionTest,02-04). 테스트를 늘리면 이 하한도 함께 올린다.

          if [ ! -d "$XML_DIR" ]; then
            echo "::error::테스트 결과 디렉터리가 없다: $XML_DIR — 테스트가 한 건도 실행되지 않았다"
            exit 1
          fi

          for cls in $REQUIRED; do
            f="$XML_DIR/TEST-com.wf11.safealert.ble.$cls.xml"
            if [ ! -f "$f" ]; then
              echo "::error::골든 테스트 클래스 결과 누락: $cls — 소스셋 경로 이탈 또는 클래스 삭제 의심"
              exit 1
            fi
          done

          TOTAL=$(awk -F'tests="' '/<testsuite/ {split($2, a, "\""); s += a[1]} END {print s+0}' "$XML_DIR"/*.xml)
          echo "discovered tests = $TOTAL (floor $MIN_TOTAL)"
          if [ "$TOTAL" -lt "$MIN_TOTAL" ]; then
            echo "::error::실행된 테스트가 $TOTAL 건으로 하한 $MIN_TOTAL 미만이다 — 테스트가 조용히 사라졌다"
            exit 1
          fi

      # 태그명에서 v 제거 → 버전 번호 추출 (예: v1.0.52 → 1.0.52)
      # is_release: 정확히 vX.Y.Z 형태인 정식 릴리스 태그만 true (거부목록이 아니라 허용목록).
      #   citest·rc·오타 등 무엇이 붙어도 false → Firebase 프로덕션 채널 무접촉.
      - name: Extract version
        id: ver
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          if printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "::notice::'$GITHUB_REF_NAME' 은 정식 릴리스 태그(vX.Y.Z)가 아니다 — Firebase 업데이트를 건너뛴다"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk safealert-${{ steps.ver.outputs.name }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v3   # node24 런타임
        with:
          name: SafeAlert v${{ steps.ver.outputs.name }}
          files: safealert-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true   # 마지막 릴리즈 이후 커밋 자동 정리

      - name: Update Firebase Realtime DB
        if: ${{ steps.ver.outputs.is_release == 'true' }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/safealert-${VER}.apk"
          # 공용 /version - v1.1.71+ 앱이 읽는 자리. 사업장 코드와 무관하게 전 기기가 여기를 본다.
          curl -fsSX PATCH \
            "${{ secrets.FIREBASE_DB_URL }}/version.json?auth=${{ secrets.FIREBASE_DB_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"latest\":\"${VER}\",\"apk_url\":\"${APK_URL}\",\"force_update\":false,\"changelog\":\"\"}"
          # 옛 자리 /wf11/version - v1.1.70 이하 현장 기기 호환용. 전 기기 갱신 확인 후 삭제한다.
          curl -fsSX PATCH \
            "${{ secrets.FIREBASE_DB_URL }}/wf11/version.json?auth=${{ secrets.FIREBASE_DB_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"latest\":\"${VER}\",\"apk_url\":\"${APK_URL}\",\"force_update\":false,\"changelog\":\"\"}"

      # DB 보안 규칙을 레포의 database.rules.json 으로 덮어쓴다. 콘솔 수작업 불필요.
      #   legacy secret 은 규칙을 우회하는 admin 권한이라, 규칙을 잠근 뒤에도 위 PATCH 는 계속 통과한다.
      - name: Deploy DB security rules
        if: ${{ steps.ver.outputs.is_release == 'true' }}
        run: |
          curl -fsSX PUT --data-binary @database.rules.json \
            "${{ secrets.FIREBASE_DB_URL }}/.settings/rules.json?auth=${{ secrets.FIREBASE_DB_SECRET }}"
