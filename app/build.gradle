plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.wf11.safealert'
    compileSdk 34

    defaultConfig {
        applicationId "com.wf11.safealert"
        minSdk 26
        targetSdk 34
        versionCode 127
        versionName "1.1.71"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 디버그 keystore 경로 명시 — CI 러너가 자동 생성한 임의 키 대신 ~/.android/debug.keystore 를
    //   강제 사용 (로컬·GitHub Actions 서명 일치 → 덮어쓰기 설치 가능)
    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        // Robolectric merged 리소스 읽기 (02-01 Task 2) — 기존 testLogging 블록 보존, 병기만.
        unitTests.includeAndroidResources = true
        // [Phase 3 T3] android.util.Log 등 stub 호출 시 예외 대신 기본값 반환 (순수 JVM 테스트용).
        //   Robolectric 테스트는 자체 sandbox classloader 로 실제 구현을 쓰므로 영향 없음.
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // (v1.1.30) UWB 정밀 거리 측정 — alpha09: compileSdk 34 / AGP 8.3 / Kotlin 1.9 / coroutines 1.7.3 호환 최신
    implementation 'androidx.core.uwb:uwb:1.0.0-alpha09'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    testImplementation 'junit:junit:4.13.2'
    // Robolectric 4.15.1 — 02-01 Task 1 체크포인트 승인 좌표(testImplementation 한정, T-02-SC 완화)
    testImplementation 'org.robolectric:robolectric:4.15.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
