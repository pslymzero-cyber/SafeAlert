plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.wf11.safealert'
    compileSdk 34

    defaultConfig {
        applicationId "com.wf11.safealert"
        minSdk 26
        targetSdk 34
        versionCode 162
        versionName "1.2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Settings PIN — injected at build time (BuildConfig + CI Secrets). The real value is never kept in the repo.
        //   Precedence: -PdevPin / ~/.gradle/gradle.properties devPin → env var SA_DEV_PIN → '000'
        buildConfigField "String", "DEV_PIN", "\"${project.findProperty('devPin') ?: System.getenv('SA_DEV_PIN') ?: '000'}\""
        // SOS mail script URL — precedence: -PsosMailUrl / ~/.gradle/gradle.properties sosMailUrl → env var SA_SOS_MAIL_URL → empty.
        //   Empty turns the mail feature off. Never put the real URL in the repo (not even the project's gradle.properties).
        buildConfigField "String", "SOS_MAIL_URL", "\"${(project.findProperty('sosMailUrl') ?: System.getenv('SA_SOS_MAIL_URL') ?: '').toString().trim()}\""
    }

    // Debug signing uses the machine's standard ~/.android/debug.keystore, so one machine's debug builds install over each other.
    //   CI ships only release-signed APKs; a debug build cannot replace a CI APK (or the reverse) without uninstalling first.
    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Release key — values come only from environment variables (no secrets in the repo or logs). CI maps Secrets → step env.
        release {
            def ks = System.getenv("SA_RELEASE_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword System.getenv("SA_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("SA_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("SA_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // A local build without the env vars produces an unsigned APK (app-release-unsigned.apk)
            if (System.getenv("SA_RELEASE_KEYSTORE")) signingConfig signingConfigs.release
            // R8 obfuscation. shrinkResources is deliberately left out. If a real device misbehaves, set this back to false.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        // Lets Robolectric read merged resources.
        unitTests.includeAndroidResources = true
        // Stubbed calls such as android.util.Log return default values instead of throwing (for pure JVM tests).
        //   Robolectric tests are unaffected: their own sandbox classloader uses the real implementations.
        unitTests.returnDefaultValues = true
        unitTests.all {
            // Cross-check tests read these repo files — a change to any of them alone reruns the tests
            inputs.files(rootProject.file('database.rules.json'), rootProject.file('scripts/sos-mail/Code.gs'),
                rootProject.file('.github/scripts/hb_digest.py'), rootProject.file('.github/scripts/analyze_alerts.py'),
                rootProject.file('.github/scripts/uwb_probe.py'))
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // UWB precise ranging — alpha09 is the newest version compatible with compileSdk 34 / AGP 8.3 / Kotlin 1.9 / coroutines 1.7.3
    implementation 'androidx.core.uwb:uwb:1.0.0-alpha09'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    // Anonymous auth — needed for the auth != null lock in the DB rules. Version comes from the BOM.
    implementation 'com.google.firebase:firebase-auth-ktx'

    testImplementation 'junit:junit:4.13.2'
    // Robolectric — runs Android framework code in JVM unit tests. testImplementation only (limits supply-chain exposure)
    testImplementation 'org.robolectric:robolectric:4.15.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
